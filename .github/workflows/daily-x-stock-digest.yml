name: 每日 X 貼文投資摘要

on:
  schedule:
    # 每天台北時間 07:30（UTC 23:30）
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印出結果不推播"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 執行每日摘要
        env:
          X_USERNAME: qq_timmy
          X_SOURCE: ${{ vars.X_SOURCE || 'api' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_RSS_URL: ${{ secrets.X_RSS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFIER: ${{ vars.NOTIFIER || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Taipei
        run: |
          python -m x_stock_tracker ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 保存已處理的貼文紀錄
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: 更新貼文追蹤狀態 [skip ci]"
          git push
